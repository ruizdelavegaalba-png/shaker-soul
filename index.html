<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shaker & Soul — Craft Cocktail Catalogue</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400;1,500&family=Playfair+Display:ital,wght@0,700;0,800;1,400;1,700&display=swap" rel="stylesheet" />
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <header class="site-header">
        <div class="header-overlay-glow"></div>
        <div class="container text-center position-relative">
            <p class="header-eyebrow">Est. 2026 - Alba Ruiz de la Vega</p>
            <h1 class="header-title">Shaker <em>&amp;</em> Soul</h1>
            <p class="header-subtitle">
                A curated catalogue of the world's most celebrated craft cocktails
            </p>

            <nav class="filter-nav" aria-label="Category filters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="Sour">Sour</button>
                <button class="filter-btn" data-filter="Stirred">Stirred</button>
                <button class="filter-btn" data-filter="Aperitivo">Aperitif</button>
                <button class="filter-btn" data-filter="Tiki">Tiki</button>
            </nav>
        </div>
    </header>

    <main class="catalogue-section">
        <div class="container">
            <div id="cardGrid" class="row g-4">
                </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container text-center">
            <p class="footer-tagline">Drink curious. Drink well.</p>
            <p class="footer-credit">Shaker &amp; Soul &copy; 2026</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
