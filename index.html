<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shaker & Soul — Craft Cocktail Catalogue</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,400;1,700&family=Lora:ital,wght@0,400;0,500;1,400;1,500&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <!-- Custom styles -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>

    <!-- ── HERO / HEADER ── -->
    <header class="site-header">
      <div class="header-noise"></div>
      <div class="container text-center position-relative">
        <p class="header-eyebrow">Est. 2024</p>
        <h1 class="header-title">Shaker <em>&amp;</em> Soul</h1>
        <p class="header-subtitle">
          A curated catalogue of the world's most celebrated craft cocktails
        </p>

        <!-- Category filters -->
        <nav class="filter-nav" aria-label="Category filters">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="Sour">Sour</button>
          <button class="filter-btn" data-filter="Stirred">Stirred</button>
          <button class="filter-btn" data-filter="Aperitivo">Aperitivo</button>
          <button class="filter-btn" data-filter="Tiki">Tiki</button>
        </nav>
      </div>
    </header>

    <!-- ── MAIN CATALOGUE ── -->
    <main class="catalogue-section">
      <div class="container">

        <!-- Cards grid -->
        <div id="cardGrid" class="row g-4"></div>

      </div>
    </main>

    <!-- ── FOOTER ── -->
    <footer class="site-footer">
      <div class="container text-center">
        <p class="footer-tagline">Drink curious. Drink well.</p>
        <p class="footer-credit">Shaker &amp; Soul &copy; 2024</p>
      </div>
    </footer>

    <!-- Bootstrap JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>

    <!-- App logic -->
    <script src="app.js"></script>
  </body>
</html>
